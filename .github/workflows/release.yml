name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - forge_build/version.rb
      - RELEASE_NOTES.md
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n "s/.*VERSION = '\\([^']*\\)'.*/\\1/p" forge_build/version.rb)"
          test -n "$version"
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.existing.outputs.exists == 'false'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Test
        if: steps.existing.outputs.exists == 'false'
        run: rake syntax test

      - name: Build RBZ
        if: steps.existing.outputs.exists == 'false'
        run: rake package

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          gh release create "$TAG" "dist/ForgeBuild-v$VERSION.rbz" \
            --target "${{ github.sha }}" \
            --title "ForgeBuild $TAG" \
            --notes-file RELEASE_NOTES.md
