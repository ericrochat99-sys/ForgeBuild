<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeBuild</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header><span class="mark">FB</span><div><h1>ForgeBuild</h1><p>Commercial Building Workspace</p></div></header>
  <main>
    <section class="card"><h2>Foundation ready</h2><p>The application shell is installed. Builder modules will appear here as they are registered.</p></section>
    <section class="card"><h2>Modules</h2><div id="modules" class="empty">No builder modules installed yet.</div></section>
    <section class="card update-card">
      <div><h2>Software updates</h2><p id="update-status">Keep ForgeBuild current with the latest GitHub release.</p></div>
      <button id="update-button" type="button">Check for Updates</button>
    </section>
  </main>
  <footer id="version"></footer>
  <script src="../js/main.js"></script>
</body>
</html>
